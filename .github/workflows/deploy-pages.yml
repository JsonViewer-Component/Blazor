name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  build:
    name: 🏗️ Build Blazor WASM
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v6

    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: 📦 Restore dependencies
      run: dotnet restore JsonViewer.Blazor.sln

    - name: 🏗️ Build
      run: dotnet build JsonViewer.Blazor.sln --configuration Release --no-restore

    - name: 📦 Publish Blazor WASM
      run: |
        dotnet publish src/Blazor.Demo/Blazor.Demo.csproj \
          -c Release \
          -o release \
          --nologo

    - name: 🔧 Configure base path for GitHub Pages
      run: |
        sed -i 's|<base href="/" />|<base href="/Blazor/" />|g' release/wwwroot/index.html
        echo "✅ Base href updated to /Blazor/"

    - name: 📝 Add .nojekyll file
      run: touch release/wwwroot/.nojekyll

    - name: 📝 Create 404.html for SPA routing
      run: cp release/wwwroot/index.html release/wwwroot/404.html

    - name: 📋 List published files
      run: |
        echo "📂 Contents of release/wwwroot:"
        ls -la release/wwwroot/

    - name: ⚙️ Setup Pages
      uses: actions/configure-pages@v5

    - name: 📤 Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: release/wwwroot

  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: 🌐 Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
